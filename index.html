<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no">
<title>Pip's Sky Run</title>
<style>
  html,body{margin:0;height:100%;background:#000;overflow:hidden;touch-action:none}
  canvas{display:block;margin:auto;image-rendering:pixelated}
  .tc{position:fixed;bottom:18px;display:none;gap:14px}
  .tc button{width:72px;height:72px;border-radius:50%;border:3px solid #fff8;background:#0005;color:#fff;font:bold 26px sans-serif}
  @media (pointer:coarse){.tc{display:flex}}
</style>
</head>
<body>
<canvas id="c"></canvas>
<div class="tc" style="left:18px"><button data-k="left">◀</button><button data-k="right">▶</button></div>
<div class="tc" style="right:18px"><button data-k="run">B</button><button data-k="jump">A</button></div>
<script>
"use strict";
// ---------- Setup: logical 480x270 (16:9), rendered at native device pixels (4K-ready) ----------
const VW = 480, VH = 270, T = 16, ROWS = 17;
const cv = document.getElementById('c'), ctx = cv.getContext('2d');
let S = 1;
function resize() {
  const dpr = window.devicePixelRatio || 1;
  const w = innerWidth, h = innerHeight;
  const cssScale = Math.min(w / VW, h / VH);
  cv.style.width = VW * cssScale + 'px';
  cv.style.height = VH * cssScale + 'px';
  cv.style.marginTop = (h - VH * cssScale) / 2 + 'px';
  S = cssScale * dpr;                       // e.g. 3840/480 = 8 on a 4K screen
  cv.width = Math.round(VW * S); cv.height = Math.round(VH * S);
  ctx.imageSmoothingEnabled = false;
}
addEventListener('resize', resize); resize();

// ---------- Input ----------
const K = { left: 0, right: 0, jump: 0, run: 0 };
const map = { ArrowLeft: 'left', KeyA: 'left', ArrowRight: 'right', KeyD: 'right',
  ArrowUp: 'jump', KeyW: 'jump', Space: 'jump', KeyZ: 'jump', ShiftLeft: 'run', KeyX: 'run', ShiftRight: 'run' };
addEventListener('keydown', e => { if (map[e.code]) { K[map[e.code]] = 1; e.preventDefault(); } if (e.code === 'Enter' || e.code === 'Space') startPress(); if (e.code === 'KeyF') document.documentElement.requestFullscreen?.();
  if (e.code === 'KeyM') { muted = !muted; localStorageSet('pipMute', muted ? '1' : '0'); }
  if ((e.code === 'KeyP' || e.code === 'Escape') && (state === 'play' || state === 'pause')) { state = state === 'play' ? 'pause' : 'play'; SFX.pause(); } });
addEventListener('blur', () => { if (state === 'play') state = 'pause'; });
addEventListener('keyup', e => { if (map[e.code]) K[map[e.code]] = 0; });
document.querySelectorAll('.tc button').forEach(b => {
  const k = b.dataset.k;
  b.addEventListener('touchstart', e => { K[k] = 1; startPress(); e.preventDefault(); });
  b.addEventListener('touchend', e => { K[k] = 0; e.preventDefault(); });
});
cv.addEventListener('pointerdown', startPress);

// ---------- Audio (tiny synth) ----------
let AC;
function beep(f, d = 0.08, type = 'square', slide = 0, vol = 0.06) {
  try {
    AC = AC || new AudioContext();
    const o = AC.createOscillator(), g = AC.createGain(), t = AC.currentTime;
    o.type = type; o.frequency.setValueAtTime(f, t);
    if (slide) o.frequency.exponentialRampToValueAtTime(slide, t + d);
    g.gain.setValueAtTime(vol, t); g.gain.exponentialRampToValueAtTime(0.0001, t + d);
    o.connect(g).connect(AC.destination); o.start(t); o.stop(t + d);
  } catch (e) {}
}
const SFX = {
  jump: () => beep(300, 0.15, 'square', 700),
  coin: () => { beep(988, 0.06); setTimeout(() => beep(1319, 0.2), 60); },
  stomp: () => beep(400, 0.1, 'triangle', 120, 0.1),
  bump: () => beep(140, 0.08, 'triangle', 90, 0.1),
  brk: () => beep(200, 0.15, 'sawtooth', 60, 0.05),
  power: () => [523, 659, 784, 1047].forEach((f, i) => setTimeout(() => beep(f, 0.1), i * 70)),
  hurt: () => beep(500, 0.4, 'square', 80),
  pause: () => beep(660, 0.08),
  win: () => [523, 659, 784, 1047, 784, 1047].forEach((f, i) => setTimeout(() => beep(f, 0.15), i * 120)),
};

// ---------- Background music: original looping chiptune (M toggles) ----------
let muted = localStorageGet('pipMute') === '1', musicStep = 0, musicTimer = null;
const MEL = [76, 0, 79, 81, 0, 79, 76, 74, 72, 0, 74, 76, 79, 0, 76, 0, 74, 0, 76, 79, 81, 0, 84, 83, 81, 79, 76, 0, 74, 72, 74, 0,
             76, 0, 79, 81, 0, 79, 76, 74, 72, 0, 74, 76, 79, 0, 81, 0, 84, 0, 83, 81, 79, 0, 76, 79, 74, 0, 72, 0, 72, 0, 0, 0];
const BASS = [48, 55, 52, 55, 45, 52, 48, 52, 41, 48, 45, 48, 43, 50, 47, 50];
const midi = n => 440 * Math.pow(2, (n - 69) / 12);
function startMusic() {
  if (musicTimer) return;
  musicTimer = setInterval(() => {
    if (muted || (state !== 'play' && state !== 'title')) return;
    const m = MEL[musicStep % MEL.length];
    if (m) beep(midi(m), 0.11, 'square', 0, 0.025);
    if (musicStep % 2 === 0) beep(midi(BASS[(musicStep >> 1) % BASS.length]), 0.18, 'triangle', 0, 0.07);
    if (musicStep % 4 === 2) beep(2000, 0.03, 'square', 400, 0.012);
    musicStep++;
  }, 135);
}

// ---------- Level ----------
const W = 224;
let L;
function buildLevel() {
  L = Array.from({ length: ROWS }, () => Array(W).fill(' '));
  const set = (x, y, c) => { if (x >= 0 && x < W && y >= 0 && y < ROWS) L[y][x] = c; };
  const gaps = [[70, 72], [88, 90], [154, 156]];
  for (let x = 0; x < W; x++) if (!gaps.some(([a, b]) => x >= a && x <= b)) { set(x, 15, '#'); set(x, 16, '#'); }
  const row = (x, y, s) => [...s].forEach((c, i) => c !== ' ' && set(x + i, y, c));
  row(16, 11, '!'); row(20, 11, 'B?B!B'); row(22, 7, '!');
  const pillar = (x, h) => { for (let i = 0; i < h; i++) { set(x, 14 - i, i === h - 1 ? 't' : 'T'); set(x + 1, 14 - i, i === h - 1 ? 't' : 'T'); } };
  pillar(29, 2); pillar(39, 3); pillar(47, 4); pillar(58, 4);
  row(78, 11, 'B?B'); row(81, 7, 'BBBBBBBB'); row(92, 7, 'BBB!'); row(95, 11, 'B');
  row(101, 11, 'BB'); row(107, 11, '!'); row(110, 11, '!'); row(113, 11, '!'); row(110, 7, '?');
  row(119, 11, 'B'); row(122, 7, 'BBB'); row(129, 7, 'B!!B'); row(130, 11, 'BB');
  const stair = (x, h, dir) => { for (let i = 0; i < h; i++) for (let j = 0; j <= i; j++) set(dir > 0 ? x + i : x + h - 1 - i, 14 - j, 'S'); };
  stair(135, 4, 1); stair(141, 4, -1); stair(149, 5, 1);
  for (let j = 0; j < 4; j++) set(153, 14 - j, 'S');
  stair(157, 4, -1);
  pillar(164, 2); row(169, 11, 'BB!B'); pillar(180, 2);
  stair(182, 8, 1); for (let j = 0; j < 8; j++) set(190, 14 - j, 'S');
  set(199, 14, 'S'); // flag base
  // coins floating
  [[33, 9], [34, 9], [35, 9], [52, 8], [53, 8], [84, 5], [85, 5], [86, 5], [70, 10], [71, 10], [72, 10], [125, 9], [126, 9], [160, 10], [161, 10]]
    .forEach(([x, y]) => set(x, y, 'o'));
}
const SOLID = new Set(['#', 'B', '!', '?', 'U', 'S', 'T', 't']);
const tile = (x, y) => (y < 0 || x < 0 || x >= W) ? (x < 0 || x >= W ? '#' : ' ') : (y >= ROWS ? ' ' : L[y][x]);
const solidAt = (x, y) => SOLID.has(tile(x, y));
const FLAG_X = 199 * T + 8;

// ---------- Game state ----------
let shake = 0;
let state = "title", P, ents = [], parts = [], bumps = {}, cam = 0, score = 0, coins = 0, lives = 3, time, frame = 0, msgT = 0, best = +(localStorageGet('pipBest') || 0);
function localStorageGet(k) { try { return localStorage.getItem(k); } catch (e) { return null; } }
function localStorageSet(k, v) { try { localStorage.setItem(k, v); } catch (e) {} }

function startLevel() {
  buildLevel();
  P = { x: 40, y: 15 * T - 14, w: 12, h: 14, vx: 0, vy: 0, big: false, face: 1, ground: false, inv: 0, anim: 0, dead: false };
  P.coyote = 0; P.buf = 0; P.sq = 0; P.wasGround = true;
  ents = []; parts = []; bumps = {}; cam = 0; time = 300; shake = 0;
  [26, 44, 52, 62, 64, 84, 98, 104, 116, 118, 126, 128, 140, 168, 172].forEach((x, i) =>
    ents.push({ type: 'blob', x: x * T, y: 15 * T - 12, w: 14, h: 12, vx: -0.5, vy: 0, alive: true, sq: 0, ground: false, hue: i % 3 }));
  ents.push({ type: 'spike', x: 112 * T, y: 15 * T - 14, w: 14, h: 14, vx: -0.6, vy: 0, alive: true, ground: false });
  ents.push({ type: 'spike', x: 176 * T, y: 15 * T - 14, w: 14, h: 14, vx: -0.6, vy: 0, alive: true, ground: false });
  state = 'play';
}
function startPress() {
  startMusic();
  if (state === 'title') { score = 0; coins = 0; lives = 3; startLevel(); }
  else if (state === 'over' || state === 'win') { if (msgT > 60) state = 'title', msgT = 0; }
}

// ---------- Physics helpers ----------
function moveBody(b, onHead) {
  b.x += b.vx;
  let x0 = Math.floor(b.x / T), x1 = Math.floor((b.x + b.w - 0.01) / T), y0 = Math.floor(b.y / T), y1 = Math.floor((b.y + b.h - 0.01) / T);
  let hitX = false;
  for (let y = y0; y <= y1; y++) {
    if (b.vx > 0 && solidAt(x1, y)) { b.x = x1 * T - b.w; hitX = true; }
    else if (b.vx < 0 && solidAt(x0, y)) { b.x = (x0 + 1) * T; hitX = true; }
  }
  b.vy = Math.min(b.vy, 7);
  b.y += b.vy; b.ground = false;
  x0 = Math.floor(b.x / T); x1 = Math.floor((b.x + b.w - 0.01) / T);
  y0 = Math.floor(b.y / T); y1 = Math.floor((b.y + b.h - 0.01) / T);
  if (b.vy > 0) {
    for (let x = x0; x <= x1; x++) if (solidAt(x, y1)) { b.y = y1 * T - b.h; b.vy = 0; b.ground = true; break; }
  } else if (b.vy < 0) {
    let hits = [];
    for (let x = x0; x <= x1; x++) if (solidAt(x, y0)) hits.push(x);
    if (hits.length) {
      b.y = (y0 + 1) * T; b.vy = 0.5;
      if (onHead) { const cx = (b.x + b.w / 2) / T; hits.sort((a, c) => Math.abs(a + 0.5 - cx) - Math.abs(c + 0.5 - cx)); onHead(hits[0], y0); }
    }
  }
  return hitX;
}
const overlap = (a, b) => a.x < b.x + b.w && a.x + a.w > b.x && a.y < b.y + b.h && a.y + a.h > b.y;

function addScore(n, x, y) { score += n; parts.push({ kind: 'txt', x, y, vy: -0.6, t: 50, s: n + '' }); }
function gainCoin(x, y) { sparkle(x + 8, y + 8, 8); coins++; SFX.coin(); addScore(100, x, y); if (coins >= 100) { coins -= 100; lives++; } }

function bump(tx, ty) {
  const c = tile(tx, ty);
  bumps[tx + ',' + ty] = 10;
  // knock enemies standing on top
  ents.forEach(e => { if (e.alive && (e.type === 'blob' || e.type === 'spike') && overlap(e, { x: tx * T, y: ty * T - 4, w: T, h: 4 })) { kill(e, true); } });
  if (c === '!') {
    L[ty][tx] = 'U'; gainCoin(tx * T, ty * T - 16);
    parts.push({ kind: 'coin', x: tx * T + 4, y: ty * T - 8, vy: -5, t: 30 });
  } else if (c === '?') {
    L[ty][tx] = 'U'; SFX.power();
    ents.push({ type: 'berry', x: tx * T + 1, y: ty * T, w: 14, h: 14, vx: 0, vy: 0, alive: true, rise: 16, ground: false });
  } else if (c === 'B') {
    if (P.big) {
      L[ty][tx] = ' '; SFX.brk(); shake = 3; score += 50; delete bumps[tx + ',' + ty];
      for (let i = 0; i < 4; i++) parts.push({ kind: 'deb', x: tx * T + (i % 2) * 8, y: ty * T + (i > 1) * 8, vx: (i % 2 ? 1.5 : -1.5), vy: i > 1 ? -4 : -6, t: 90 });
    } else SFX.bump();
  } else SFX.bump();
}
function kill(e, flip) {
  e.alive = false; SFX.stomp(); shake = Math.max(shake, 1.5); sparkle(e.x + 7, e.y + 6, 6, '#ffffff'); addScore(flip ? 200 : 100, e.x, e.y - 8);
  if (flip) parts.push({ kind: 'flip', type: e.type, x: e.x, y: e.y, vx: 0.8, vy: -4, t: 90, hue: e.hue });
  else parts.push({ kind: 'squash', type: e.type, x: e.x, y: e.y, t: 30, hue: e.hue });
}
function hurt() {
  if (P.inv > 0) return;
  if (P.big) { P.big = false; P.y += 10; P.h = 14; P.inv = 120; SFX.hurt(); }
  else die();
}
function die() {
  if (P.dead) return;
  P.dead = true; P.vy = -6; shake = 5; P.vx = 0; SFX.hurt(); state = 'dead'; msgT = 0;
}

// ---------- Update ----------
function update() {
  frame++;
  if (state === 'title' || state === 'pause') return;
  if (state === 'over' || state === 'win') { msgT++; return; }
  if (state === 'dead') {
    msgT++; P.vy += 0.3; P.y += P.vy;
    if (msgT > 150) { lives--; if (lives <= 0) { state = 'over'; msgT = 0; saveBest(); } else startLevel(); }
    return;
  }
  if (state === 'flag') {
    msgT++;
    if (P.y + P.h < 14 * T) P.y += 2; else { P.face = 1; P.x += 1.2; P.anim += 0.2; }
    if (msgT % 4 === 0 && time > 0) { time = Math.max(0, time - 3); score += 30; }
    if (P.x > 206 * T) { state = 'win'; msgT = 0; saveBest(); SFX.win(); }
    return;
  }
  if (frame % 40 === 0) { time--; if (time <= 0) die(); }

  // player control
  const run = K.run, max = run ? 3.2 : 2, acc = P.ground ? 0.18 : 0.12;
  if (K.left && !K.right) { P.vx = Math.max(P.vx - acc, -max); P.face = -1; }
  else if (K.right && !K.left) { P.vx = Math.min(P.vx + acc, max); P.face = 1; }
  else { P.vx *= P.ground ? 0.82 : 0.96; if (Math.abs(P.vx) < 0.05) P.vx = 0; }
  if (Math.abs(P.vx) > max) P.vx *= 0.95;
  // jump buffer (press slightly early) + coyote time (press slightly late)
  if (K.jump && !P.jumpHeld) P.buf = 8; else if (P.buf > 0) P.buf--;
  P.coyote = P.ground ? 6 : Math.max(0, P.coyote - 1);
  if (P.buf > 0 && P.coyote > 0) {
    P.vy = -(6.2 + Math.abs(P.vx) * 0.35); SFX.jump(); P.ground = false; P.buf = 0; P.coyote = 0; P.sq = -0.6;
    dust(P.x + P.w / 2, P.y + P.h, 4);
  }
  P.jumpHeld = K.jump;
  P.vy += (K.jump && P.vy < 0) ? 0.18 : 0.42;
  const fallV = P.vy;
  moveBody(P, bump);
  if (P.ground && !P.wasGround && fallV > 2.5) { P.sq = Math.min(1, fallV / 7); dust(P.x + P.w / 2, P.y + P.h, 6); }
  P.wasGround = P.ground;
  P.sq *= 0.8;
  if (P.ground && Math.abs(P.vx) > 2.4 && frame % 6 === 0) dust(P.x + P.w / 2 - P.face * 5, P.y + P.h, 1);
  if (P.x < cam) { P.x = cam; P.vx = Math.max(0, P.vx); }
  P.anim += P.ground ? Math.abs(P.vx) * 0.12 : 0;
  if (P.inv > 0) P.inv--;
  if (P.y > ROWS * T + 20) die();

  // coins in map
  const tx0 = Math.floor(P.x / T), tx1 = Math.floor((P.x + P.w) / T), ty0 = Math.floor(P.y / T), ty1 = Math.floor((P.y + P.h) / T);
  for (let y = ty0; y <= ty1; y++) for (let x = tx0; x <= tx1; x++) if (tile(x, y) === 'o') { L[y][x] = ' '; gainCoin(x * T, y * T); }

  // flag
  if (P.x + P.w > FLAG_X - 1 && state === 'play') {
    state = 'flag'; msgT = 0; P.x = FLAG_X - P.w; P.vx = 0; P.vy = 0;
    const h = Math.max(0, Math.floor((14 * T - P.y) / 16)); addScore([100, 400, 800, 2000, 5000][Math.min(4, Math.floor(h / 2))], P.x, P.y);
    SFX.power();
  }

  // entities
  for (const e of ents) {
    if (!e.alive) continue;
    if (e.x > cam + VW + 64) continue; // dormant until near
    if (e.type === 'berry' && e.rise > 0) { e.y -= 0.5; e.rise -= 0.5; if (e.rise <= 0) e.vx = 1.1; continue; }
    e.vy += 0.4;
    if (moveBody(e)) e.vx = -e.vx;
    if (e.y > ROWS * T + 30) { e.alive = false; continue; }
    if (e.type === 'blob') e.sq = (e.sq + 0.15) % (Math.PI * 2);
    if (overlap(e, P) && !P.dead) {
      if (e.type === 'berry') { e.alive = false; SFX.power(); addScore(1000, e.x, e.y); sparkle(P.x + 6, P.y + 6, 14, '#ff9cc8'); if (!P.big) { P.big = true; P.y -= 10; P.h = 24; } continue; }
      if (e.type === 'blob' && P.vy > 0 && P.y + P.h - e.y < 9) { kill(e, false); P.vy = K.jump ? -7 : -4.5; }
      else hurt();
    }
  }
  // enemies turn on each other
  for (let i = 0; i < ents.length; i++) for (let j = i + 1; j < ents.length; j++) {
    const a = ents[i], b = ents[j];
    if (a.alive && b.alive && a.type !== 'berry' && b.type !== 'berry' && overlap(a, b)) { a.vx = -Math.sign(b.x - a.x) * Math.abs(a.vx) || a.vx; b.vx = Math.sign(b.x - a.x) * Math.abs(b.vx); }
  }
  ents = ents.filter(e => e.alive);

  // camera
  const target = Math.max(0, Math.min(P.x + P.vx * 20 - VW * 0.4, W * T - VW));
  if (target > cam) cam += (target - cam) * 0.12;
}
function dust(x, y, n) {
  for (let i = 0; i < n; i++) parts.push({ kind: 'dust', x: x + (Math.random() - 0.5) * 8, y: y - 2, vx: (Math.random() - 0.5) * 1.2, vy: -Math.random() * 0.6, t: 22 + Math.random() * 10, r: 1.5 + Math.random() * 2 });
}
function sparkle(x, y, n, col = '#fff7c0') {
  for (let i = 0; i < n; i++) { const a = Math.random() * 7, s = 0.6 + Math.random() * 1.6; parts.push({ kind: 'spark', x, y, vx: Math.cos(a) * s, vy: Math.sin(a) * s, t: 25 + Math.random() * 15, col }); }
}
function saveBest() { if (score > best) { best = score; localStorageSet('pipBest', best); } }

function updateParts() {
  for (const p of parts) {
    p.t--;
    if (p.kind === 'txt') p.y += p.vy;
    else if (p.kind === 'coin') { p.y += p.vy; p.vy += 0.35; }
    else if (p.kind === 'deb' || p.kind === 'flip') { p.x += p.vx; p.y += p.vy; p.vy += 0.3; }
    else if (p.kind === 'dust' || p.kind === 'spark') { p.x += p.vx; p.y += p.vy; p.vx *= 0.92; p.vy *= 0.92; }
  }
  parts = parts.filter(p => p.t > 0);
  for (const k in bumps) if (--bumps[k] <= 0) delete bumps[k];
  shake *= 0.85;
}

// ---------- Drawing ----------
let SIL = null;
function R(x, y, w, h, c) { ctx.fillStyle = SIL || c; ctx.fillRect(Math.round(x * S), Math.round(y * S), Math.ceil(w * S), Math.ceil(h * S)); }
function C(x, y, r, c) { ctx.fillStyle = SIL || c; ctx.beginPath(); ctx.arc(x * S, y * S, r * S, 0, 7); ctx.fill(); }
// draw a sprite with a crisp dark outline (silhouette pass offset in 4 directions)
function outlined(fn, col = '#1a1020') {
  SIL = col;
  for (const [dx, dy] of [[-1, 0], [1, 0], [0, -1], [0, 1]]) { ctx.save(); ctx.translate(dx * S * 0.8, dy * S * 0.8); fn(); ctx.restore(); }
  SIL = null; fn();
}
const hash = i => { const s = Math.sin(i * 127.1) * 43758.5453; return s - Math.floor(s); };
let skyG, vigG, gS = 0;
function grads() {
  if (gS === S) return; gS = S;
  skyG = ctx.createLinearGradient(0, 0, 0, VH * S);
  skyG.addColorStop(0, '#2f6fe0'); skyG.addColorStop(0.55, '#7fb8ff'); skyG.addColorStop(0.85, '#c8e4ff'); skyG.addColorStop(1, '#ffe9c9');
  vigG = ctx.createRadialGradient(VW / 2 * S, VH / 2 * S, VH * 0.45 * S, VW / 2 * S, VH / 2 * S, VW * 0.65 * S);
  vigG.addColorStop(0, 'rgba(0,0,0,0)'); vigG.addColorStop(1, 'rgba(10,20,50,0.35)');
}
function drawBackground() {
  grads();
  ctx.fillStyle = skyG; ctx.fillRect(0, 0, cv.width, cv.height);
  // sun with soft glow
  const sx = (400 - cam * 0.02) * S, sy = 42 * S;
  const sg = ctx.createRadialGradient(sx, sy, 10 * S, sx, sy, 70 * S);
  sg.addColorStop(0, 'rgba(255,248,200,0.7)'); sg.addColorStop(1, 'rgba(255,248,200,0)');
  ctx.fillStyle = sg; ctx.fillRect(sx - 70 * S, sy - 70 * S, 140 * S, 140 * S);
  C(400 - cam * 0.02, 42, 16, '#fff8d6');
  // far snowy mountains
  const p0 = cam * 0.12;
  for (let i = Math.floor(p0 / 90) - 1; i < (p0 + VW) / 90 + 2; i++) {

    R(90, 46, 300, 150, 'rgba(15,20,50,0.55)'); R(90, 46, 300, 2, '#ffd23a'); R(90, 194, 300, 2, '#ffd23a');
    const by = Math.sin(frame / 20) * 2;
    text("PIP'S SKY RUN", 240, 60 + by, 28, '#ffd23a', 'center');
    drawHero(222, 100, true, 1, frame / 10, frame % 120 < 60);
    if (frame % 60 < 42) text('Press ENTER / tap to start', 240, 140, 10, '#fff', 'center');
    text('←→ move   SPACE/Z jump   SHIFT/X run', 240, 158, 7, '#cfe', 'center');
    text('P pause   M music   F fullscreen', 240, 169, 7, '#cfe', 'center');
    text('BEST ' + best, 240, 182, 7, '#ffd23a', 'center');
    return;
  }
  drawLevel();
  drawEntities();
  if (!(P.inv > 0 && frame % 6 < 3)) drawHero(P.x - cam, P.y, P.big, P.face, P.anim, P.ground || state === 'flag', P.sq);
  ctx.fillStyle = vigG; ctx.fillRect(-20 * S, -20 * S, cv.width + 40 * S, cv.height + 40 * S);
  hud();
  if (state === 'pause') { R(0, 0, VW, VH, 'rgba(10,15,40,0.55)'); text('PAUSED', 240, 115, 24, '#fff', 'center'); text('press P to resume', 240, 145, 8, '#cfe', 'center'); }
  if (state === 'over') { R(0, 0, VW, VH, '#000a'); text('GAME OVER', 240, 110, 24, '#ff6b8b', 'center'); text('Score ' + score + '  ·  press ENTER', 240, 145, 9, '#fff', 'center'); }
  if (state === 'win') { R(0, 0, VW, VH, '#0006'); text('COURSE CLEAR!', 240, 100, 24, '#ffd23a', 'center'); text('Score ' + score + '  ·  Best ' + best, 240, 135, 10, '#fff', 'center'); text('press ENTER', 240, 155, 8, '#cfe', 'center'); }
}

// ---------- Main loop (fixed 60Hz step) ----------
let last = performance.now(), accT = 0;
function loop(now) {
  accT += Math.min(100, now - last); last = now;
  while (accT >= 1000 / 60) { update(); if (state !== 'title' && state !== 'pause') updateParts(); accT -= 1000 / 60; }
  draw();
  requestAnimationFrame(loop);
}
requestAnimationFrame(loop);
</script>
